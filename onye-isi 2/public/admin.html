<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>Onye Isi · Admin</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#1A1108;--cream:#FAF6EE;--line:#E9E1D0;--muted:#7A6E5D;--gold:#C9A84C;--ok:#1E6B3F;--bad:#9B2F26}
body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--cream);color:var(--ink);line-height:1.55}
.wrap{max-width:900px;margin:0 auto;padding:24px 20px 60px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}h1{font-size:22px}
.btn{padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:#fff;font:inherit;font-weight:600;font-size:14px;cursor:pointer}
.btn.gold{background:var(--gold);border-color:var(--gold)}.btn.ok{background:#D6EEDD;border-color:#D6EEDD;color:var(--ok)}.btn.bad{background:#F6D9D6;border-color:#F6D9D6;color:var(--bad)}
.tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}.tabs .btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px;display:flex;gap:14px}
.card img{width:64px;height:64px;border-radius:50%;object-fit:cover;flex:none}.ph{width:64px;height:64px;border-radius:50%;background:#F6E2B8;flex:none;display:grid;place-items:center;font-weight:700}
.body{flex:1;min-width:0}.meta{font-size:13px;color:var(--muted)}.bio{font-size:14px;margin:6px 0}
.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 10px;border-radius:99px;background:#EEE6D3;margin-left:6px}
.chip.approved{background:#D6EEDD;color:var(--ok)}.chip.rejected{background:#F6D9D6;color:var(--bad)}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
form{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;max-width:380px;margin:40px auto;display:grid;gap:12px}
label{font-size:13px;font-weight:600}input{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--line);font:inherit;margin-top:4px}
.msg{font-size:14px;font-weight:600;color:var(--bad)}.empty{color:var(--muted);padding:30px 0;text-align:center}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="empty">Loading…</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script>
const SB = { url: "https://hregrxngtmekccxzxotz.supabase.co", key: "sb_publishable_U75nqHazrNZBGi6VII0rkg_FNDp0jx2" }; // public key; security is enforced by Supabase
const sb = window.supabase.createClient(SB.url, SB.key);
const $app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let tab = "pending", rows = [];

function loginView(msg = "") {
  $app.innerHTML = `<form id="f"><h1>Admin login</h1>
    <div><label>Email<input id="e" type="email" required autocomplete="email" /></label></div>
    <div><label>Password<input id="p" type="password" required autocomplete="current-password" /></label></div>
    <button class="btn gold" type="submit">Log in</button><div class="msg" id="m">${esc(msg)}</div></form>`;
  document.getElementById("f").addEventListener("submit", async e => {
    e.preventDefault();
    const { error } = await sb.auth.signInWithPassword({ email: document.getElementById("e").value.trim(), password: document.getElementById("p").value });
    if (error) { document.getElementById("m").textContent = "Email or password is incorrect."; return; }
    start();
  });
}
async function start() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return loginView();
  const { data: ok } = await sb.rpc("is_admin");
  if (!ok) { await sb.auth.signOut(); return loginView("This account is not an admin."); }
  await load();
}
async function load() {
  const { data, error } = await sb.from("stylists").select("id,name,city,type,spec,bio,price_from,avail,services,photo_url,status,is_example,created_at").order("created_at", { ascending: false });
  if (error) { $app.innerHTML = `<p class="empty">Could not load stylists: ${esc(error.message)}</p>`; return; }
  rows = data; render();
}
function render() {
  const count = s => rows.filter(r => r.status === s).length;
  const list = rows.filter(r => tab === "all" || r.status === tab);
  $app.innerHTML = `<header><h1>Stylist approvals</h1><button class="btn" id="out">Log out</button></header>
    <div class="tabs">${[["pending", "Pending"], ["approved", "Approved"], ["rejected", "Rejected"], ["all", "All"]].map(([k, n]) =>
      `<button class="btn${tab === k ? " on" : ""}" data-tab="${k}">${n}${k !== "all" ? " (" + count(k) + ")" : ""}</button>`).join("")}</div>
    ${list.length ? list.map(r => `<div class="card">
      ${r.photo_url ? `<img src="${esc(r.photo_url)}" alt="" />` : `<div class="ph">${esc(r.name.slice(0, 1))}</div>`}
      <div class="body"><strong>${esc(r.name)}</strong><span class="chip ${r.status}">${esc(r.status)}</span>${r.is_example ? '<span class="chip">example</span>' : ""}
        <div class="meta">${esc(r.city)} · ${esc(r.type)} · ${esc(r.spec)}${r.price_from ? " · " + esc(r.price_from) : ""}${r.avail ? " · " + esc(r.avail) : ""}</div>
        ${r.bio ? `<div class="bio">${esc(r.bio)}</div>` : ""}
        <div class="meta">${(Array.isArray(r.services) ? r.services : []).map(s => esc(s[0]) + " " + esc(s[1] || "")).join(" · ")}</div>
        <div class="acts">${r.status !== "approved" ? `<button class="btn ok" data-set="approved" data-id="${r.id}">Approve</button>` : ""}
          ${r.status !== "rejected" ? `<button class="btn bad" data-set="rejected" data-id="${r.id}">Reject</button>` : ""}
          ${r.status !== "pending" ? `<button class="btn" data-set="pending" data-id="${r.id}">Move to pending</button>` : ""}</div></div></div>`).join("")
      : '<p class="empty">Nothing here.</p>'}`;
}
$app.addEventListener("click", async e => {
  const t = e.target.closest("[data-tab]"); if (t) { tab = t.dataset.tab; render(); return; }
  if (e.target.id === "out") { await sb.auth.signOut(); loginView(); return; }
  const b = e.target.closest("[data-set]");
  if (b) {
    b.disabled = true;
    const { error } = await sb.rpc("admin_set_stylist_status", { p_id: +b.dataset.id, p_status: b.dataset.set });
    if (error) { alert("Could not update: " + error.message); b.disabled = false; return; }
    await load();
  }
});
start();
</script>
</body>
</html>
